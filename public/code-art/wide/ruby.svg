<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800">
  <title>Ruby</title>
  <defs>
    <radialGradient id="g1" cx="1020" cy="100" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CC342D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#CC342D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80" cy="760" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A6B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF7A6B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
