  <rect width="1160" height="800" fill="url(#g1)"/>
  <rect width="1160" height="800" fill="url(#g2)"/>
  <text x="68" y="132" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#ffafa6">// blocks and iterators</text>
  <text x="64" y="640" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="-3" fill="#FFFFFF">Ruby</text>
  <text x="68" y="696" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ffafa6">.rb</text>
  <rect x="500" y="192" width="600" height="416" rx="28" fill="url(#pane)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="540" cy="232" r="8" fill="#FF5F57"/>
  <circle cx="568" cy="232" r="8" fill="#FEBC2E"/>
  <circle cx="596" cy="232" r="8" fill="#28C840"/>
  <text x="1060" y="240" text-anchor="end" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#8B8FA3">app.rb</text>
  <path d="M500 264H1100" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="27">
    <text x="536" y="332" xml:space="preserve"><tspan fill="#8B8FA3">%</tspan><tspan fill="#D5D7E2">w</tspan><tspan fill="#8B8FA3">[</tspan><tspan fill="#D5D7E2">ruby</tspan> <tspan fill="#D5D7E2">is</tspan> <tspan fill="#D5D7E2">fun</tspan><tspan fill="#8B8FA3">]</tspan><tspan fill="#8B8FA3">.</tspan><tspan fill="#D5D7E2">each</tspan> <tspan fill="#de7b77">do</tspan> <tspan fill="#8B8FA3">|</tspan><tspan fill="#D5D7E2">w</tspan><tspan fill="#8B8FA3">|</tspan></text>
    <text x="536" y="376" xml:space="preserve">  <tspan fill="#de7b77">puts</tspan> <tspan fill="#D5D7E2">w</tspan><tspan fill="#8B8FA3">.</tspan><tspan fill="#D5D7E2">capitalize</tspan></text>
    <text x="536" y="420" xml:space="preserve"><tspan fill="#de7b77">end</tspan></text>
    <text x="536" y="464" xml:space="preserve"></text>
    <text x="536" y="508" xml:space="preserve"><tspan fill="#F9C97C">5</tspan><tspan fill="#8B8FA3">.</tspan><tspan fill="#D5D7E2">times</tspan> <tspan fill="#8B8FA3">{</tspan> <tspan fill="#8B8FA3">|</tspan><tspan fill="#D5D7E2">i</tspan><tspan fill="#8B8FA3">|</tspan> <tspan fill="#de7b77">print</tspan> <tspan fill="#D5D7E2">i</tspan> <tspan fill="#8B8FA3">}</tspan></text>
  </g>
