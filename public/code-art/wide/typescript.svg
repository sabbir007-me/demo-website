  <text x="68" y="132" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#66daff">// typed user model</text>
  <text x="64" y="640" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="66" letter-spacing="-3" fill="#FFFFFF">TypeScript</text>
  <text x="68" y="696" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#66daff">.ts</text>
  <rect x="500" y="148" width="600" height="504" rx="28" fill="url(#pane)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="540" cy="188" r="8" fill="#FF5F57"/>
  <circle cx="568" cy="188" r="8" fill="#FEBC2E"/>
  <circle cx="596" cy="188" r="8" fill="#28C840"/>
  <text x="1060" y="196" text-anchor="end" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#8B8FA3">app.ts</text>
  <path d="M500 220H1100" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="27">
    <text x="536" y="288" xml:space="preserve"><tspan fill="#79a7da">type</tspan> <tspan fill="#adc9e8">User</tspan> <tspan fill="#8B8FA3">=</tspan> <tspan fill="#8B8FA3">{</tspan></text>
    <text x="536" y="332" xml:space="preserve">  <tspan fill="#D5D7E2">id</tspan><tspan fill="#8B8FA3">:</tspan> <tspan fill="#D5D7E2">number</tspan><tspan fill="#8B8FA3">;</tspan></text>
    <text x="536" y="376" xml:space="preserve">  <tspan fill="#D5D7E2">name</tspan><tspan fill="#8B8FA3">:</tspan> <tspan fill="#D5D7E2">string</tspan><tspan fill="#8B8FA3">;</tspan></text>
    <text x="536" y="420" xml:space="preserve"><tspan fill="#8B8FA3">}</tspan><tspan fill="#8B8FA3">;</tspan></text>
    <text x="536" y="464" xml:space="preserve"></text>
    <text x="536" y="508" xml:space="preserve"><tspan fill="#79a7da">const</tspan> <tspan fill="#D5D7E2">hi</tspan> <tspan fill="#8B8FA3">=</tspan> <tspan fill="#8B8FA3">(</tspan><tspan fill="#D5D7E2">u</tspan><tspan fill="#8B8FA3">:</tspan> <tspan fill="#adc9e8">User</tspan><tspan fill="#8B8FA3">)</tspan><tspan fill="#8B8FA3">:</tspan> <tspan fill="#D5D7E2">string</tspan> <tspan fill="#8B8FA3">=</tspan><tspan fill="#8B8FA3">&gt;</tspan></text>
    <text x="536" y="552" xml:space="preserve">  <tspan fill="#4dd4ff">`Hi, ${u.name}`</tspan><tspan fill="#8B8FA3">;</tspan></text>
