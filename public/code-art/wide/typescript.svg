      <stop offset="0" stop-color="#3178C6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3178C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80" cy="760" r="620" gradientUnits="userSpaceOnUse">
