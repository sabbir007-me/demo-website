  <text x="68" y="132" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#ffd1a6">// struct with interpolation</text>
  <text x="64" y="640" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="133" letter-spacing="-3" fill="#FFFFFF">Swift</text>
  <text x="68" y="696" font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ffd1a6">.swift</text>
