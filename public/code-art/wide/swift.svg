  <path d="M500 242H1100" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="27">
    <text x="536" y="310" xml:space="preserve"><tspan fill="#f58e7e">struct</tspan> <tspan fill="#f9b9af">Planet</tspan> <tspan fill="#8B8FA3">{</tspan></text>
    <text x="536" y="354" xml:space="preserve">    <tspan fill="#f58e7e">let</tspan> <tspan fill="#D5D7E2">name</tspan><tspan fill="#8B8FA3">:</tspan> <tspan fill="#f9b9af">String</tspan></text>
    <text x="536" y="398" xml:space="preserve"><tspan fill="#8B8FA3">}</tspan></text>
    <text x="536" y="442" xml:space="preserve"></text>
    <text x="536" y="486" xml:space="preserve"><tspan fill="#f58e7e">let</tspan> <tspan fill="#D5D7E2">home</tspan> <tspan fill="#8B8FA3">=</tspan> <tspan fill="#f9b9af">Planet</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#D5D7E2">name</tspan><tspan fill="#8B8FA3">:</tspan> <tspan fill="#ffca97">"Earth"</tspan><tspan fill="#8B8FA3">)</tspan></text>
    <text x="536" y="530" xml:space="preserve"><tspan fill="#FFFFFF">print</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#ffca97">"Hello, \(home.name)"</tspan><tspan fill="#8B8FA3">)</tspan></text>
