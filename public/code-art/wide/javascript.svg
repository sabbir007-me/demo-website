    <text x="536" y="310" xml:space="preserve"><tspan fill="#faea6d">const</tspan> <tspan fill="#D5D7E2">greet</tspan> <tspan fill="#8B8FA3">=</tspan> <tspan fill="#8B8FA3">(</tspan><tspan fill="#D5D7E2">name</tspan><tspan fill="#8B8FA3">)</tspan> <tspan fill="#8B8FA3">=</tspan><tspan fill="#8B8FA3">&gt;</tspan></text>
