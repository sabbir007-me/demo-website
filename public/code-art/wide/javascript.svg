    <text x="536" y="530" xml:space="preserve">  <tspan fill="#8B8FA3">.</tspan><tspan fill="#D5D7E2">textContent</tspan> <tspan fill="#8B8FA3">=</tspan> <tspan fill="#FFFFFF">greet</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#ffad4d">"web"</tspan><tspan fill="#8B8FA3">)</tspan><tspan fill="#8B8FA3">;</tspan></text>
