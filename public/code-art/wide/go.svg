  <path d="M500 176H1100" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="27">
    <text x="536" y="244" xml:space="preserve"><tspan fill="#59cae6">package</tspan> <tspan fill="#D5D7E2">main</tspan></text>
    <text x="536" y="288" xml:space="preserve"></text>
