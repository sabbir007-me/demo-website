    <text x="536" y="376" xml:space="preserve"></text>
    <text x="536" y="420" xml:space="preserve"><tspan fill="#59cae6">func</tspan> <tspan fill="#FFFFFF">main</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#8B8FA3">)</tspan> <tspan fill="#8B8FA3">{</tspan></text>
    <text x="536" y="464" xml:space="preserve">    <tspan fill="#D5D7E2">ch</tspan> <tspan fill="#8B8FA3">:</tspan><tspan fill="#8B8FA3">=</tspan> <tspan fill="#59cae6">make</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#59cae6">chan</tspan> <tspan fill="#D5D7E2">string</tspan><tspan fill="#8B8FA3">)</tspan></text>
    <text x="536" y="508" xml:space="preserve">    <tspan fill="#59cae6">go</tspan> <tspan fill="#59cae6">func</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#8B8FA3">)</tspan> <tspan fill="#8B8FA3">{</tspan> <tspan fill="#D5D7E2">ch</tspan> <tspan fill="#8B8FA3">&lt;</tspan><tspan fill="#8B8FA3">-</tspan> <tspan fill="#dd7091">"hi"</tspan> <tspan fill="#8B8FA3">}</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#8B8FA3">)</tspan></text>
    <text x="536" y="552" xml:space="preserve">    <tspan fill="#D5D7E2">fmt</tspan><tspan fill="#8B8FA3">.</tspan><tspan fill="#99deef">Println</tspan><tspan fill="#8B8FA3">(</tspan><tspan fill="#8B8FA3">&lt;</tspan><tspan fill="#8B8FA3">-</tspan><tspan fill="#D5D7E2">ch</tspan><tspan fill="#8B8FA3">)</tspan></text>
    <text x="536" y="596" xml:space="preserve"><tspan fill="#8B8FA3">}</tspan></text>
